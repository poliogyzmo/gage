<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu de Gages Immersif</title>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background-color:#000;
  font-family:sans-serif;
  color:#fff;
  overflow:hidden;
}

/* ===== Menu flottant ===== */
.menu-button {
  position:fixed;
  top:10px;
  left:10px;
  z-index:100;
  padding:12px 18px;
  border-radius:10px;
  background:rgba(50,50,50,0.8);
  cursor:pointer;
  font-weight:bold;
  font-size:18px;
  transition:background 0.3s ease;
}

.menu-button:hover {
  background:rgba(80,80,80,0.9);
}

/* ===== Menu de filtres ===== */
.filters {
  position:fixed;
  top:60px;
  left:10px;
  z-index:100;
  background:rgba(50,50,50,0.95);
  padding:20px;
  border-radius:12px;
  display:none;
  flex-direction:column;
  gap:12px;
  max-height:90%;
  width:280px;
  overflow-y:auto;
  font-size:16px;
}

.filters select,
.filters button {
  padding:10px 12px;
  border-radius:6px;
  border:none;
  background:#222;
  color:#fff;
  cursor:pointer;
  font-size:15px;
}

.filters button {
  background-color:#4CAF50;
  font-weight:bold;
}

.filters button:hover {
  background-color:#3a9c42;
}

/* ===== Zone jeu ===== */
.game-container {
  width:100%;
  height:100%;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}

#gif {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:100%;
  height:100%;
  object-fit:contain;
  z-index:1;
}

#texte {
  position:absolute;
  top:5%;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  text-align:center;
  font-size:1.8vw;
  font-weight:bold;
  color:#fff;
  text-shadow:2px 2px 10px rgba(0,0,0,0.7);
  padding:8px 12px;
  background:rgba(0,0,0,0.4);
  border-radius:8px;
  max-width:80%;
  word-wrap:break-word;
}

@media (max-width:768px){

  #texte {
    font-size:4vw;
  }

  .filters {
    width:85%;
    left:50%;
    transform:translateX(-50%);
  }

}
</style>
</head>

<body>

<!-- ===== MENU ===== -->

<div class="menu-button" id="menuButton">
  ☰ Menu
</div>

<div class="filters" id="filtersMenu">

  <!-- Niveau -->
  <select id="niveau">
    <option value="">Niveau</option>
    <option value="debut">Preliminaires</option>
    <option value="mains">Avec les mains</option>
    <option value="bouche">Avec la bouche</option>
    <option value="avance">Avec son sexe</option>
    <option value="anal">Anal</option>
  </select>

  <!-- Ambiance -->
  <select id="ambiance">
    <option value="">Ambiance</option>
    <option value="romantique">Romantique</option>
    <option value="domination">Domination</option>
    <option value="bondage">Bondage</option>
  </select>

  <!-- Genre -->
  <select id="genre">
    <option value="">Genre</option>
    <option value="homme">Homme</option>
    <option value="femme">Femme</option>
  </select>

  <!-- Lieu -->
  <select id="lieu">
    <option value="">Lieu</option>
    <option value="interieur">Interieur</option>
    <option value="exterieur">Exterieur</option>
  </select>

  <!-- Type spécial -->
  <select id="type_special">
    <option value="">Anal ?</option>
    <option value="non">Non</option>
    <option value="langue">Avec la langue</option>
    <option value="doigt">Juste un doigt</option>
    <option value="jouet">Plug, gode, crochet</option>
    <option value="oui">Pénétration sexe ou gode ceinture</option>
  </select>

  <!-- ⭐ NOUVEAU : PRATIQUE -->
<select id="bondage">
    <option value="">Pratique</option>
    <option value="entrave">Entrave</option>
    <option value="laissecollier">Laisse / Collier</option>
    <option value="shibari">Shibari</option>
    <option value="sensoriel">Privation sensoriel</option>
</select>

<select id="discipline">
    <option value="gifle">Gifle</option>
    <option value="fessee">Fessée</option>
    <option value="objetimpact">Fouet/cravache/etc</option>
</select>

<select id="soumission">
    <option value="respiration">Contrôle de la respiration</option>
    <option value="humiliation">Humiliation</option>
    <option value="boule">Boule de soumission, Bâillon</option>
    <option value="salive">Crachet et salive</option>
    <option value="bodywriting">Body writing</option>
</select>

<select id="masochisme">
    <option value="griffure">Griffure/morsure</option>
    <option value="pince_teton">Pince téton</option>
    <option value="lame">Couteau/roue/etc</option>
    <option value="chaud_froid">Chaud/Froid</option>
</select>

<select id="sextoy">
    <option value="plug">Plug</option>
    <option value="crochet">Crochet</option>
    <option value="gode">Gode, vibro</option>
    <option value="double_gode">Double gode</option>
    <option value="connecte">Sextoy connecté</option>
    <option value="womanizer">Womanizer</option>
</select>

<select id="autre">
    <option value="camera">Caméra/photo/téléphone</option>
    <option value="miroir">Miroir</option>
    <option value="exhib">Exhibition</option>
    <option value="ludique">Ludique</option>
    <option value="mutuel">Mutuel</option>
</select>

  <button id="btnTirer">
    🎲 Tirer un gage
  </button>

</div>


<!-- ===== ZONE DE JEU ===== -->

<div class="game-container">

  <img id="gif" src="" alt="">

  <div id="texte"></div>

</div>


<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'


/* =========================================
   SUPABASE
========================================= */

const supabaseUrl =
  'https://yqqhvanwoxmnakmzaqya.supabase.co'

const supabaseKey =
   'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxcWh2YW53b3htbmFrbXphcXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA1MjA4NzYsImV4cCI6MjA3NjA5Njg3Nn0.eEHQBsTKNP9_nQ6LqFBjVgx_9WX9pY1uyX7xaedvn0o'


const supabase = createClient(
  supabaseUrl,
  supabaseKey
)


/* =========================================
   ELEMENTS
========================================= */

const menuButton =
  document.getElementById('menuButton')

const filtersMenu =
  document.getElementById('filtersMenu')

const btnTirer =
  document.getElementById('btnTirer')


/* =========================================
   MENU
========================================= */

menuButton.addEventListener('click', () => {

  filtersMenu.style.display =
    filtersMenu.style.display === 'flex'
      ? 'none'
      : 'flex'

})


/* =========================================
   TIRAGE
========================================= */

async function tirerGage() {

  /*
    On ferme le menu après avoir lancé
    le tirage
  */

  filtersMenu.style.display = 'none'


  /* ================================
     RÉCUPÉRATION DES FILTRES
  ================================= */

  const filtres = {

    niveau:
      document.getElementById('niveau').value,

    ambiance:
      document.getElementById('ambiance').value,

    genre:
      document.getElementById('genre').value,

    lieu:
      document.getElementById('lieu').value,

    anal:
      document.getElementById('type_special').value,

    /* ⭐ NOUVEAU */
    bondage:
      document.getElementById('bondage').value,
    discipline:
      document.getElementById('discipline').value,
      soumission:
      document.getElementById('soumission').value,
      masochisme:
      document.getElementById('masochisme').value,
      sextoy:
      document.getElementById('sextoy').value,
      autre:
      document.getElementById('autre').value


    

  }


  /* ================================
     REQUÊTE SUPABASE
  ================================= */

  let query =
    supabase
      .from('gages')
      .select('*')


  /* ================================
     FILTRE NIVEAU
  ================================= */

  if (filtres.niveau) {

    query =
      query.eq(
        'niveau',
        filtres.niveau
      )

  }


  /* ================================
     FILTRE AMBIANCE
  ================================= */

  if (filtres.ambiance) {

    query =
      query.eq(
        'ambiance',
        filtres.ambiance
      )

  }


  /* ================================
     FILTRE LIEU
  ================================= */

  if (filtres.lieu) {

    query =
      query.eq(
        'lieu',
        filtres.lieu
      )

  }


  /* ================================
     FILTRE TYPE SPÉCIAL
  ================================= */

  if (filtres.type_special) {

    query =
      query.eq(
        'type_special',
        filtres.type_special
      )

  }


  /* ================================
     FILTRE GENRE
     Homme/Femme + Mixte
  ================================= */

  if (filtres.genre) {

    query =
      query.in(
        'genre',
        [
          filtres.genre,
          'mixte'
        ]
      )

  }


  /* ================================
     ⭐ FILTRE PRATIQUE
  ================================= */

  if (filtres.bondage) {

    query =
      query.eq(
        filtres.bondage,
        true
      )

  }
 if (filtres.discipline) {

    query =
      query.eq(
        filtres.discipline,
        true
      )

  } if (filtres.soumission) {

    query =
      query.eq(
        filtres.soumission,
        true
      )

  } if (filtres.masochisme) {

    query =
      query.eq(
        filtres.masochisme,
        true
      )

  } if (filtres.sextoy) {

    query =
      query.eq(
        filtres.sextoy,
        true
      )

  } if (filtres.autre) {

    query =
      query.eq(
        filtres.autre,
        true
      )

  }

  /* ================================
     EXÉCUTION
  ================================= */

  const {
    data,
    error
  } = await query


  /* ================================
     ERREUR
  ================================= */

  if (error) {

    console.error(
      'Erreur Supabase :',
      error
    )

    alert(
      "Erreur lors du tirage 😢"
    )

    return

  }


  /* ================================
     AUCUN GAGE
  ================================= */

  if (!data || data.length === 0) {

    alert(
      "Aucun gage trouvé 😅"
    )

    return

  }


  /* ================================
     TIRAGE ALÉATOIRE
  ================================= */

  const gage =
    data[
      Math.floor(
        Math.random() * data.length
      )
    ]


  /* ================================
     AFFICHAGE
  ================================= */

  document.getElementById('gif').src =
    gage.gif_url || ''

  document.getElementById('texte').textContent =
    gage.texte || ''

}


/* =========================================
   BOUTON
========================================= */

btnTirer.addEventListener(
  'click',
  tirerGage
)

</script>

</body>
</html>
