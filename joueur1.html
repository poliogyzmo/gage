
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Préférences du joueur 1</title>

<style>
:root {
  --bg: #101114;
  --card: #1d1f25;
  --muted: #a7a9b4;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #f97316;
  --blue: #06b6d4;
  --purple: #c77dff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px 14px 40px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f0f0f, #1c1c24);
  color: white;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
}

.top {
  text-align: center;
  margin-bottom: 24px;
}

h1 {
  font-size: clamp(23px, 4vw, 34px);
  margin: 12px 0;
}

.subtitle {
  color: var(--muted);
  line-height: 1.5;
}

.legend {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 22px 0;
}

.legend-item {
  background: #1d1f25;
  border: 1px solid #353741;
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
  line-height: 1.4;
}

.legend-item strong {
  display: block;
  margin-bottom: 4px;
}

.legend-item.green strong { color: var(--green); }
.legend-item.red strong { color: var(--red); }
.legend-item.orange strong { color: var(--orange); }
.legend-item.blue strong { color: var(--blue); }

.theme {
  margin: 28px 0;
}

.theme h2 {
  font-size: 19px;
  margin: 0 0 12px;
  padding-bottom: 9px;
  border-bottom: 1px solid #363841;
}

.theme-description {
  color: var(--muted);
  font-size: 13px;
  margin: -4px 0 14px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.pref-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100px;
  padding: 14px 9px;
  border: 2px solid #D8C5F5;
  border-radius: 15px;
  background: #F1E8FF;
  color: #000000;
  cursor: pointer;
  text-align: center;
  transition: border-color .15s, background .15s, transform .15s;
  -webkit-tap-highlight-color: transparent;
}

.pref-card:hover {
  background: #E8D9FF;
  transform: translateY(-2px);
}

.pref-card:focus-visible {
  outline: 3px solid white;
  outline-offset: 3px;
}

.pref-card .illustration {
  display: block;
  width: 76px;
  height: 76px;
  object-fit: contain;
  margin-bottom: 9px;
}

.pref-card .name {
  color: #000000;
  font-size: 13px;
  line-height: 1.35;
  font-weight: bold;
}

.pref-card .state {
  font-size: 11px;
  line-height: 1.3;
  margin-top: 8px;
  color: #333333;
}

/* État 1 : oui pour moi */
.pref-card[data-state="1"] {
  border-color: var(--green);
  background: #143020;
}
.pref-card[data-state="1"] .state { color: var(--green); }

/* État 2 : non pour moi */
.pref-card[data-state="2"] {
  border-color: var(--red);
  background: #351919;
}
.pref-card[data-state="2"] .state { color: var(--red); }

/* État 3 : non pour moi, oui pour l'autre */
.pref-card[data-state="3"] {
  border-color: var(--orange);
  background: #382416;
}
.pref-card[data-state="3"] .state { color: var(--orange); }

/* État 4 : oui pour l'autre */
.pref-card[data-state="4"] {
  border-color: var(--blue);
  background: #123039;
}
.pref-card[data-state="4"] .state { color: var(--blue); }

.actions {
  position: sticky;
  bottom: 10px;
  display: flex;
  gap: 10px;
  justify-content: center;
  padding: 12px 0;
  background: linear-gradient(transparent, #101114 20%);
}

button.action {
  border: 0;
  border-radius: 12px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#resetBtn {
  color: white;
  background: #363841;
}

#nextBtn {
  color: white;
  background: var(--purple);
  flex: 1;
  max-width: 360px;
}

#nextBtn:hover { background: #a855f7; }

@media (max-width: 600px) {
  body { padding: 14px 10px 25px; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pref-card { min-height: 135px; }
  .legend { gap: 6px; }
  .legend-item { padding: 8px; font-size: 12px; }
  .theme h2 { font-size: 17px; }
}

@media (min-width: 800px) {
  .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
</style>
</head>

<body>
<div class="container">

  <header class="top">
    <h1 id="playerName">Préférences</h1>
    <p class="subtitle">
      Appuie sur chaque carte pour indiquer tes préférences.<br>
      Chaque clic passe à l'état suivant.
    </p>
  </header>

  <div class="legend">
    <div class="legend-item green">
      <strong>🟢 Vert — 1 clic</strong>
      Oui pour moi
    </div>
    <div class="legend-item red">
      <strong>🔴 Rouge — 2 clics</strong>
      Non pour moi
    </div>
    <div class="legend-item orange">
      <strong>🟠 Orange — 3 clics</strong>
      Non pour moi, oui pour l'autre
    </div>
    <div class="legend-item blue">
      <strong>🔵 Bleu — 4 clics</strong>
      Oui pour l'autre
    </div>
  </div>

  <main id="prefs"></main>

  <div class="actions">
    <button class="action" id="resetBtn" type="button">
      Tout effacer
    </button>
    <button class="action" id="nextBtn" type="button">
      Valider et continuer →
    </button>
  </div>

</div>

<script>
const setup = JSON.parse(localStorage.getItem('gameSetup')) || {};

document.getElementById('playerName').textContent =
  'Préférences de ' + (setup.joueur1 || 'Joueur 1');

const PREF_KEYS = [
  'entrave','laissecollier','shibari','sensoriel',
  'gifle','fessee','objetimpact',
  'respiration', 'humiliation', 'boule', 'salive', 'bodywriting',
  'griffure', 'pince_teton', 'lame','chaud_froid',
  'plug','crochet','gode','double_gode','connecte','womanizer',
  'camera', 'miroir', 'exhib','ludique', 'mutuel'
];

const ITEMS = {
  respiration: {
    label: 'Contrôle de la respiration',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/etranglement.png",
    theme: 'Soumission'
  },
  sensoriel: {
    label: 'Privation sensorielle : yeux bandés, etc.',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/sens.png",
    theme: 'Bondage'
  },
  chaud_froid: {
    label: 'Chaud / froid : glaçon, cire',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/bougie.png",
    theme: 'Masochisme'
  },
  shibari: {
    label: 'Shibari : jeu avec les cordes',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/shibari.png",
    theme: 'Bondage'
  },
  entrave: {
    label: 'Entraves : menottes, cordes, etc.',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/entraves.png",
    theme: 'Bondage'
  },
  laissecollier: {
    label: 'Collier et laisse',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/collier.png",
    theme: 'Bondage'
  },
  plug: {
    label: 'Plug',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/plug.png",
    theme: 'Sextoys'
  },
    crochet: {
    label: 'Crochet anal',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/crochet.png",
    theme: 'Sextoys'
  },
    gode: {
    label: 'Gode, vibromasseur',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/gode.png",
    theme: 'Sextoys'
  },
    double_gode: {
    label: 'Double gode',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/double.png",
    theme: 'Sextoys'
  },
    connecte: {
    label: 'Sextoy connecté',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/vibration.png",
    theme: 'Sextoys'
  },
    womanizer: {
    label: 'Womanizer',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/womanizer.png",
    theme: 'Sextoys'
  },
  gifle: {
    label: 'Gifle au visage, seins ou sexe',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/gifler.png",
    theme: 'Discipline'
  },
  fessee: {
    label: 'Fessée',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/fessee.png",
    theme: 'Discipline'
  },
  objetimpact: {
    label: 'Cravache, fouet, canne, etc.',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/fouet.png",
    theme: 'Discipline'
  },
  griffure: {
    label: 'Griffure, morsure, coups',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/griffure.png",
    theme: 'Masochisme'
  },
  pince_teton: {
    label: 'Pinces tétons',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/pinces.png",
    theme: 'Masochisme'
  },
  lame: {
    label: 'Couteau, roue, etc',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/couteau.png",
    theme: 'Masochisme'
  },
  humiliation: {
    label: 'Humiliation',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/humiliation.png",
    theme: 'Soumission'
  },
  salive: {
    label: 'Crachat et salive',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/cracher.png",
    theme: 'Soumission'
  },
  bodywriting: {
    label: 'Écriture sur le corps',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/ecrire.png",
    theme: 'Soumission'
  },
  exhib: {
    label: 'Exhibition',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/couple.png",
    theme: 'Autres'
  },
  camera: {
    label: 'Caméra, photo, téléphone',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/camera.png",
    theme: 'Autres'
  },
  miroir: {
    label: 'Devant le miroir',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/miroir.png",
    theme: 'Autres'
  },
  ludique: {
    label: 'Jeux, défis, pile ou face',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/jeu.png",
    theme: 'Autres'
  },
  mutuel: {
    label: 'Gage mutuel',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/mutuel.png",
    theme: 'Autres'
  },
  boule: {
    label: 'Boule de soumission, bâillonnement',
    image: "https://raw.githubusercontent.com/poliogyzmo/asset/main/boule.png",
    theme: 'Soumission'
  }
};

const STATE_LABELS = {
  0: 'Neutre · aucun choix',
  1: '✓ Oui pour moi',
  2: '✕ Non pour moi',
  3: 'Non pour moi · Oui pour l’autre',
  4: '✓ Oui pour l’autre'
};

const STATE_HINTS = {
  0: 'Clique pour choisir',
  1: 'Clique : non pour moi',
  2: 'Clique : non pour moi, oui pour l’autre',
  3: 'Clique : oui pour l’autre',
  4: 'Clique : effacer le choix'
};

// État de chaque carte : 0 à 4
const states = Object.fromEntries(PREF_KEYS.map(key => [key, 0]));

const previous =
  JSON.parse(localStorage.getItem('joueur1Prefs')) || {};

// Permet de retrouver les choix si la page est revisitée.
PREF_KEYS.forEach(key => {
  const self = previous.envies_self || [];
  const block = previous.envies_block || [];
  const other = previous.envies_other || [];

  if (block.includes(key) && other.includes(key)) {
    states[key] = 3;
  } else if (other.includes(key)) {
    states[key] = 4;
  } else if (block.includes(key)) {
    states[key] = 2;
  } else if (self.includes(key)) {
    states[key] = 1;
  }
});

const grouped = {};
PREF_KEYS.forEach(key => {
  const theme = ITEMS[key].theme;
  if (!grouped[theme]) grouped[theme] = [];
  grouped[theme].push(key);
});

const container = document.getElementById('prefs');

Object.entries(grouped).forEach(([theme, keys]) => {
  const section = document.createElement('section');
  section.className = 'theme';

  const heading = document.createElement('h2');
  heading.textContent = theme;
  section.appendChild(heading);

  const cards = document.createElement('div');
  cards.className = 'cards';

  keys.forEach(key => {
    const item = ITEMS[key];
    const card = document.createElement('button');

    card.type = 'button';
    card.className = 'pref-card';
    card.dataset.key = key;
    card.dataset.state = String(states[key]);
    card.setAttribute('aria-pressed', states[key] !== 0 ? 'true' : 'false');

    const illustration = document.createElement('img');
illustration.className = 'illustration';
illustration.src = item.image;
illustration.alt = item.label;
illustration.loading = 'lazy';

illustration.onerror = () => {
  console.error('Impossible de charger cette image :', item.image);
};

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = item.label;

    const state = document.createElement('span');
    state.className = 'state';
    state.textContent = STATE_LABELS[states[key]];

    card.append(illustration, name, state);

    card.addEventListener('click', () => {
      states[key] = (states[key] + 1) % 5;
      card.dataset.state = String(states[key]);
      card.setAttribute(
        'aria-pressed',
        states[key] !== 0 ? 'true' : 'false'
      );

      state.textContent = STATE_LABELS[states[key]];
      card.title = STATE_HINTS[states[key]];
    });

    card.title = STATE_HINTS[states[key]];
    cards.appendChild(card);
  });

  section.appendChild(cards);
  container.appendChild(section);
});

function getPreferences() {
  const envies_self = [];
  const envies_block = [];
  const envies_other = [];

  PREF_KEYS.forEach(key => {
    const state = states[key];

    if (state === 1) {
      envies_self.push(key);
    } else if (state === 2) {
      envies_block.push(key);
    } else if (state === 3) {
      envies_block.push(key);
      envies_other.push(key);
    } else if (state === 4) {
      envies_other.push(key);
    }
  });

  return { envies_self, envies_block, envies_other };
}

document.getElementById('resetBtn').addEventListener('click', () => {
  PREF_KEYS.forEach(key => states[key] = 0);

  document.querySelectorAll('.pref-card').forEach(card => {
    card.dataset.state = '0';
    card.setAttribute('aria-pressed', 'false');
    card.querySelector('.state').textContent = STATE_LABELS[0];
    card.title = STATE_HINTS[0];
  });
});

document.getElementById('nextBtn').addEventListener('click', () => {
  localStorage.setItem('joueur1Prefs', JSON.stringify(getPreferences()));
  window.location.href = 'joueur2.html';
});
</script>
</body>
</html>
